name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The Node 24 pin and the folded pack step stay: `check` ends with `parity`, which
# runs the built package under Node (V8) against hashes recorded under Bun, so the
# Node major is part of the test, and `check:ci` adds `npm pack --dry-run` so the
# pack listing comes from the one job that built `dist`.
jobs:
  check:
    uses: trajectonomics/cicd/.github/workflows/check.yml@v1
    with:
      node-version: "24"
      script: check:ci
